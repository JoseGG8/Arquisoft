#Workflow name
name: CI/CD Pipeline
on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  #Test's job
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'oracle'
          cache: 'maven'
          cache-dependency-path: 'lab12026p/pom.xml'

      #Run Tests
      - name: Run Tests
        run: mvn -B test
        working-directory: lab12026p
  
  #Sonar's Job
  sonar:
    name: SonarCloud analysis
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '23'
          cache: 'maven'
          cache-dependency-path: 'lab12026p/pom.xml'

      - name: Java version
        run: java -version

      - name: Maven version
        run: mvn -version

      - name: Build project & generate JaCoCo report
        run: mvn -B clean verify
        working-directory: lab12026p

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=JoseGG8_Arquisoft
          -Dsonar.organization=josegg8
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=$SONAR_TOKEN
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        working-directory: lab12026p

  #Build's job
  build:
    needs: sonar
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'oracle'
          cache: 'maven'
          cache-dependency-path: 'lab12026p/pom.xml'

      #Build the application using Maven
      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml
        working-directory: lab12026p

      #Upload JAR
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: lab12026p/target/lab12026p.jar

      - name: Build & push Docker image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: ${{ secrets.DOCKER_USERNAME }}/lab12026p
          tags: latest
          registry: docker.io
          directory: lab12026p
          dockerfile: lab12026p/Dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}